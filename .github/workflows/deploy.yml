name: Deploy to GCP (Mock)

on:
  push:
    branches: [ main ]

env:
  PROJECT_ID: mock-project-id
  GAR_LOCATION: asia-northeast3
  SERVICE_NAME: enterprise-erp-backend
  REPOSITORY: erp-repo

jobs:
  build-and-simulate-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    # - name: Google Auth (Skipped for Dummy Mode)
    #   uses: google-github-actions/auth@v1
    #   with:
    #     credentials_json: ${{ secrets.GCP_SA_KEY }}

    # - name: Set up Cloud SDK (Skipped)
    #   uses: google-github-actions/setup-gcloud@v1

    - name: Build Docker Image (Backend)
      run: |
        echo "Building Backend Docker Image..."
        docker build -t app-backend:latest ./backend
        echo "Backend Build Successful!"

    - name: Build Docker Image (Frontend)
      run: |
        echo "Building Frontend Docker Image..."
        cd frontend
        npm install
        npm run build
        docker build -t app-frontend:latest .
        echo "Frontend Build Successful!"

    - name: Simulate Deployment to Cloud Run
      run: |
        echo "----------------------------------------"
        echo "       DUMMY DEPLOYMENT PROCESS         "
        echo "----------------------------------------"
        echo "Target: Google Cloud Run (Simulated)"
        echo "Region: ${{ env.GAR_LOCATION }}"
        echo "Service: ${{ env.SERVICE_NAME }}"
        echo "Pushing images to Artifact Registry... [MOCKED]"
        echo "Deploying container... [MOCKED]"
        echo "----------------------------------------"
        echo "Deployment Successful! (Dummy Mode)"
