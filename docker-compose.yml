version: '3.8'
services:
  redis:
    image: redis:6-alpine
  
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@db.supabase.co:5432/postgres
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    build: ./backend
    command: celery -A worker.celery_app worker --loglevel=info
    depends_on:
      - redis

  frontend:
    build: ./frontend
    ports:
      - "80:80"
